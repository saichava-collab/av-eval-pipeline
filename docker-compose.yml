version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: av_postgres
    environment:
      POSTGRES_USER: av_user
      POSTGRES_PASSWORD: av_pass
      POSTGRES_DB: av_eval
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av_user -d av_eval"]
      interval: 5s
      timeout: 5s
      retries: 10

  go-service:
    build: ./go-service
    container_name: av_go_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://av_user:av_pass@postgres:5432/av_eval?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"

  python-service:
    build: ./python-service
    container_name: av_python_service
    depends_on:
      - go-service
    environment:
      GO_SERVICE_URL: http://go-service:8080
      INGEST_CHUNK_SIZE: "500"
      PARALLEL_INGEST_WORKERS: "8"
      # Uncomment and fill in to export for real instead of local-fallback CSVs:
      # GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-key.json
      # BIGQUERY_PROJECT: my-gcp-project
      # BIGQUERY_DATASET: av_eval
      # BIGQUERY_TABLE: scenario_runs
      # REDSHIFT_HOST: my-cluster.xxxx.us-east-1.redshift.amazonaws.com
      # REDSHIFT_DATABASE: av_eval
      # REDSHIFT_USER: av_user
      # REDSHIFT_PASSWORD: change_me
    ports:
      - "8000:8000"

  dashboard:
    # Vite bakes VITE_* vars in at build time, not container runtime, so
    # they are not set here. App.jsx already defaults to
    # http://localhost:8080 / http://localhost:8000, which is correct
    # because docker-compose publishes those same ports to the host.
    build: ./dashboard
    container_name: av_dashboard
    depends_on:
      - go-service
      - python-service
    ports:
      - "5173:5173"

volumes:
  pgdata:
